<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrôle responsive et langues</title><style>body{margin:0;background:#dfdfd7;font:14px Arial;color:#173b2e}header{padding:12px 16px;background:#193a2d;color:white;display:flex;gap:16px;align-items:center;flex-wrap:wrap}label{display:flex;align-items:center;gap:5px}select,button{font:inherit;min-height:40px;padding:7px}main{padding:20px;overflow:auto}iframe{display:block;margin:auto;height:790px;border:0;background:#f8f4e9;box-shadow:0 5px 25px #0003}#state{padding:10px 20px;background:white}pre{white-space:pre-wrap;max-height:350px;overflow:auto;padding:20px;font:12px/1.5 monospace}</style><header><b>Vérification finale</b><label>Langue<select id="lang"><option value="fr">Français</option><option value="de">Deutsch</option><option value="en">English</option><option value="zh">简体中文</option><option value="ru">Русский</option><option value="ko">한국어</option><option value="it">Italiano</option><option value="es">Español</option></select></label><label>Page<select id="page"><option value="index">Accueil</option><option value="chambres">Chambres</option><option value="restaurant">Restaurant</option><option value="sejours">Séjours</option><option value="vallee">Vallée</option><option value="maison">Chalet</option><option value="infos">Infos</option><option value="reservation">Réserver</option></select></label><label>Largeur<select id="size"><option>360</option><option>390</option><option>320</option><option>768</option><option>980</option><option>1280</option><option>1440</option><option>1600</option></select></label><label><input type="checkbox" id="text">Texte 200 %</label><button id="top">En haut</button><button id="postman">Postier</button><button id="menu">Carte</button><button id="footer">Pied de page</button><button id="audit">Auditer les 8 pages</button><button id="audit-all">Auditer les 8 langues</button><button id="audit-fixes">Contrôler les corrections et le grand écran</button></header><div id="state" role="status">Prêt</div><main><iframe id="view" title="Site à vérifier" width="375" src="/index.html?motion=reduce"></iframe></main><pre id="report"></pre><script>
const view=document.querySelector('#view'),page=document.querySelector('#page'),lang=document.querySelector('#lang'),size=document.querySelector('#size'),status=document.querySelector('#state'),report=document.querySelector('#report');
const route=(p,l)=>(l==='fr'?'':'/'+l)+'/'+p+'.html?motion=reduce';
function apply(){const w=view.contentWindow,d=view.contentDocument;if(document.querySelector('#text').checked){const els=[...d.body.querySelectorAll('*')].filter(e=>e.namespaceURI==='http://www.w3.org/1999/xhtml');const sizes=els.map(e=>[e,parseFloat(w.getComputedStyle(e).fontSize)]);sizes.forEach(([e,n])=>e.style.setProperty('font-size',n*2+'px','important'));}}
view.addEventListener('load',apply);
function navigate(){view.width=Number(size.value)+15;view.src=route(page.value,lang.value);}
[page,lang,size,document.querySelector('#text')].forEach(x=>x.addEventListener('change',navigate));
document.querySelector('#top').onclick=()=>view.contentWindow.scrollTo({top:0,behavior:'instant'});
for(const [id,selector]of[['postman','.pc-postcard-send'],['footer','.foot__credit'],['menu','[data-carte]']])document.querySelector('#'+id).onclick=()=>view.contentDocument.querySelector(selector)?.scrollIntoView({block:'center',behavior:'instant'});
function inspect(p,l,width){const d=view.contentDocument,w=view.contentWindow,cw=d.documentElement.clientWidth;const overflow=[...d.querySelectorAll('h1,h2,h3,p,button,a,label,summary,input,select')].filter(e=>{if(!e.textContent.trim()||!e.getClientRects().length||e.closest('[hidden],.top__brand,.egg-trigger,.pc-cut,.pc-hero__art,.pc-souvenir-stanza,.egg-scene,.stay-cards,.stay-filters,.stay-jumps,.anchors__list,.footer-languages'))return false;return e.clientWidth>0&&e.scrollWidth>e.clientWidth+3&&!['auto','scroll'].includes(w.getComputedStyle(e).overflowX);}).map(e=>({tag:e.tagName,class:e.className,text:e.textContent.trim().slice(0,90),width:e.clientWidth,scroll:e.scrollWidth}));return{page:p,lang:l,width,actualWidth:cw,pageOverflow:d.documentElement.scrollWidth-cw,h1:d.querySelectorAll('h1').length,textOverflows:overflow,brokenImages:[...d.images].filter(i=>i.getAttribute('src')&&i.complete&&!i.naturalWidth&&!i.closest('[hidden]')).map(i=>i.getAttribute('src'))};}
async function run(all,fixes=false){const langs=all?[...lang.options].map(o=>o.value):[lang.value],widths=fixes?[360,768,1600]:all?[360,768,1440]:[320,360,390,768,980,1440];const rows=[];document.querySelectorAll('header button,header select,header input').forEach(x=>x.disabled=true);for(const l of langs)for(const width of widths)for(const p of (fixes&&width<1600?['restaurant']:[...page.options].map(o=>o.value))){status.textContent=`${l} · ${p} · ${width} px · ${rows.length} contrôles terminés`;await new Promise(resolve=>{view.onload=async()=>{await view.contentDocument.fonts.ready;view.contentWindow.requestAnimationFrame(()=>view.contentWindow.requestAnimationFrame(resolve));};view.width=width+15;view.src=route(p,l);});rows.push(inspect(p,l,width));report.textContent=JSON.stringify(rows,null,2);}view.onload=null;document.querySelectorAll('header button,header select,header input').forEach(x=>x.disabled=false);status.textContent=`Terminé : ${rows.length} contrôles. ${rows.filter(r=>r.pageOverflow>1||r.textOverflows.length||r.brokenImages.length||r.h1!==1).length} résultats à examiner.`;}
document.querySelector('#audit').onclick=()=>run(false);document.querySelector('#audit-all').onclick=()=>run(true);document.querySelector('#audit-fixes').onclick=()=>run(true,true);
</script></html>
